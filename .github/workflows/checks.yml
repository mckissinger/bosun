name: checks

on:
  pull_request:
  # Without a merge queue, main is re-checked after each merge (core rules, "Merge setup").
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  # Only PR runs cancel superseded ones; a cancelled push run would leave that commit of main untested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The job name is the required status check on main.
  checks:
    # GitHub-hosted: Blacksmith runners need an organization, and this repo is personal (free for public repos).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: JSON parses
        run: for f in .claude-plugin/*.json hooks/hooks.json; do python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }; done
      - name: Python compiles
        run: python3 -c "import glob, py_compile; [py_compile.compile(f, cfile='/tmp/c.pyc', doraise=True) for f in glob.glob('scripts/*.py')]"
      - name: Whitespace
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}" HEAD
          fi
      - name: Plugin validates
        run: npx -y @anthropic-ai/claude-code plugin validate .
